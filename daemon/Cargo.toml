[package]
name = "delightd"
version = "0.2.0"
edition = "2021"
description = "Omarchy Delight native iPhone link: ANCS notifications and AMS media over Bluetooth LE"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs"] }
uuid = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
opt-level = "s"
