# Howdy Next fragment for the Omarchy Delight IR bridge.
# This is not a complete config.ini. Do not copy it over /etc/howdy/config.ini.
# Apply only the device, after Howdy Next is installed:
#
#   sudo howdy set device_path /dev/v4l/by-id/delight-ir
#
# device_path is the v4l2loopback node this bridge fills while a capture is
# held. It is not the Himax HM1092. The sensor is a MIPI CSI-2 camera selected
# by name (hm1092) through libcamera. Real HM1092 frames are unverified until
# this runs on an ASUS Zenbook A16 (UX3607OA).
#
# Howdy Next is a convenience check. Keep a password. This file does not
# change PAM.

[video]
device_path = /dev/v4l/by-id/delight-ir
frame_width = -1
frame_height = -1
